<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tracker</title>
<style>
:root{--face:#C0C0C0;--hi:#FFFFFF;--lt:#DFDFDF;--sh:#808080;--dk:#000000;--desk:#008080;--navy:#000080;--min:#FFD000;--max:#FF7F27;--part:#EFE4BE}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:#000;font:12px/1.35 Tahoma,Verdana,"Segoe UI",sans-serif}
body{padding:16px 8px 32px}
button,input,textarea{font:inherit;color:#000}
.win{max-width:620px;margin:0 auto;background:var(--face);padding:3px;border:2px solid;border-color:var(--lt) var(--dk) var(--dk) var(--lt);box-shadow:inset 1px 1px var(--hi),inset -1px -1px var(--sh)}
.title{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 3px 3px 5px;background:linear-gradient(90deg,#000080,#1084D0);color:#fff;font-weight:700}
.title h1{margin:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.tb{width:16px;height:14px;display:grid;place-items:center;background:var(--face);border:1px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh)}
.b{background:var(--face);min-height:23px;padding:2px 10px;cursor:pointer;border:1px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--lt)}
.b:active,.b.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--lt)}
.b.on{background:repeating-conic-gradient(var(--face) 0 25%,var(--hi) 0 50%) 0 0/2px 2px}
.b:focus-visible,.dot:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.bar{display:flex;align-items:center;gap:3px;padding:4px 2px;flex-wrap:wrap}
.sep{width:2px;height:21px;margin:0 3px;border-left:1px solid var(--sh);border-right:1px solid var(--hi)}
.when{flex:1;min-width:120px;text-align:center;font-weight:700}
.sunken,.field{background:#fff;border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--lt)}
.field{padding:3px 4px;border-radius:0}
.field:focus{outline:none}
fieldset{margin:8px 2px 0;padding:4px 8px 6px;border:1px solid var(--sh);box-shadow:1px 1px var(--hi),inset 1px 1px var(--hi);min-width:0}
legend{padding:0 3px}
.row{display:flex;align-items:center;gap:8px;min-height:26px;padding:1px 0}
.lab{flex:1;min-width:0}
.lab small{color:#505050;margin-left:4px}
.lab .crit{display:block;color:#606060;font-size:11px}
.dots{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px}
.dot{width:20px;height:20px;padding:0;border-radius:50%;cursor:pointer;background:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center;border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk)}
span.dot{cursor:default}
.thr{width:1px;height:16px;background:var(--sh);margin:0 1px}
.num{width:64px;text-align:right}
.unit{color:#505050}
.prog{display:flex;align-items:center;gap:8px;margin:4px 2px 0}
.pbar{flex:1;height:18px;padding:2px}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--navy) 0 8px,transparent 8px 10px)}
textarea.field{width:100%;resize:vertical;margin-top:3px}
.scroll{overflow-x:auto;margin:8px 2px 0}
table.wk{border-collapse:collapse;width:100%;min-width:360px}
.wk th,.wk td{padding:3px 2px;border-bottom:1px solid #E4E4E4;text-align:center;white-space:nowrap}
.wk td.it{text-align:left;max-width:96px;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.wk thead th{position:sticky;top:0;background:var(--face);border-bottom:1px solid var(--sh);padding:2px}
.wk tr.gh th{text-align:left;background:#E8E8E8;padding:3px 4px}
.wk td.na{background:repeating-linear-gradient(45deg,#fff 0 3px,#E8E8E8 3px 5px)}
.wk td.tot{border-left:1px solid var(--sh);color:#404040;font-size:11px}
.wk tfoot td{font-weight:700;border-top:1px solid var(--sh)}
.dh{width:100%;min-width:28px;min-height:30px;padding:1px;line-height:1.15}
.dh.today{font-weight:700;color:var(--navy)}
.m{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid var(--sh);background:#fff;vertical-align:-1px}
.mn{font-size:10px;margin-left:1px;color:#404040}
.dot[data-s="p"]{background:var(--part)}
.dot[data-s="1"]{background:var(--min)}
.dot[data-s="2"]{background:var(--max)}
.m[data-s="p"]{background:var(--part)}
.m[data-s="1"]{background:var(--min)}
.m[data-s="2"]{background:var(--max)}
.key{display:flex;gap:12px;align-items:center;margin:8px 4px 2px;color:#303030;flex-wrap:wrap}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--sh);background:#fff;vertical-align:-2px;margin-right:3px}
.status{display:flex;gap:2px;margin-top:6px}
.status div{flex:1 1 0;min-width:0;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.warn{color:#A00000}
dialog{padding:3px;width:min(600px,calc(100vw - 16px));background:var(--face);border:2px solid;border-color:var(--lt) var(--dk) var(--dk) var(--lt);box-shadow:inset 1px 1px var(--hi),inset -1px -1px var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.25)}
dialog textarea{width:100%;height:60vh;font:11px/1.45 "Lucida Console",Consolas,monospace;white-space:pre;tab-size:2}
.hide{display:none}
</style>
</head>
<body>
<main class="win">
  <div class="title">
    <h1><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x=".5" y="1.5" width="13" height="12" fill="#fff" stroke="#000"/><rect x=".5" y="1.5" width="13" height="3" fill="#000080" stroke="#000"/><circle cx="4" cy="8" r="1.5" fill="#FFD000" stroke="#000" stroke-width=".6"/><circle cx="8" cy="8" r="1.5" fill="#FF7F27" stroke="#000" stroke-width=".6"/><circle cx="4" cy="11.2" r="1.5" fill="#fff" stroke="#000" stroke-width=".6"/></svg><span id="ttl">Daily Tracker</span></h1>
    <div style="display:flex;gap:2px" aria-hidden="true"><span class="tb"><svg width="8" height="7"><path d="M1 6h6" stroke="#000" stroke-width="2"/></svg></span><span class="tb"><svg width="9" height="8"><rect x=".5" y=".5" width="8" height="7" fill="none" stroke="#000"/><path d="M0 1.5h9" stroke="#000"/></svg></span></div>
  </div>
  <div class="bar">
    <button class="b" id="prev" title="Previous (←)">&#9664;</button>
    <button class="b" id="today" title="Today (T)">Today</button>
    <button class="b" id="next" title="Next (→)">&#9654;</button>
    <div class="when" id="when"></div>
    <button class="b" id="vDay">Day</button>
    <button class="b" id="vWeek" title="Toggle view (W)">Week</button>
  </div>
  <div class="bar" style="padding-top:0">
    <button class="b" id="exp">Export…</button>
    <button class="b" id="imp" title="Backup .json or config .yaml">Import…</button>
    <span class="sep"></span>
    <button class="b" id="edit">Habits…</button>
    <input type="file" id="file" accept=".json,.yaml,.yml,application/json,text/yaml" class="hide">
  </div>
  <div id="view"></div>
  <div class="key"><span><i></i>missed</span><span><i style="background:var(--part)"></i>partial</span><span><i style="background:var(--min)"></i>min</span><span><i style="background:var(--max)"></i>max</span><span style="color:#606060">right-click a counter to subtract</span></div>
  <div class="status" role="status"><div id="s1"></div><div id="s2"></div><div id="s3"></div><div id="s4"></div></div>
</main>

<dialog id="dlg" aria-labelledby="dlgT">
  <div class="title"><h1 id="dlgT">habits.yaml</h1></div>
  <div style="padding:8px 6px 4px">
    <textarea id="cfg" class="field" spellcheck="false"></textarea>
    <div id="cfgErr" class="warn" style="min-height:16px;margin-top:3px"></div>
    <div class="bar"><button class="b" id="cfgDef">Defaults</button><button class="b" id="cfgSave">Save .yaml</button><span style="flex:1"></span><button class="b" id="cfgOk" style="min-width:75px">OK</button><button class="b" id="cfgNo" style="min-width:75px">Cancel</button></div>
  </div>
</dialog>

<script type="text/yaml" id="defaultYaml">
# Daily Tracker · habits config v2
#
#   id: Name                     daily check · tap cycles missed → min → max
#   id: {name: …, options}
#
#   note: text                   hint beside the name
#   days: mon wed fri            or weekdays | weekend | daily (default)
#   every: 2                     every N weeks on `days`, counted from `start`
#   start / end: YYYY-MM-DD      active date range
#   per_week: 3 | 3-4            flexible target, scored per week (min-max)
#   count: 6                     counter with 6 units (one circle each)
#   show: one                    counter as a single circle · tap +1, right-click −1
#   value: mi                    number entry in that unit
#   min / max                    number → threshold for count/value (max defaults to
#                                count, min to max) · text → criteria for a check
#
# ids key your history: rename `name` freely, keep ids stable.
# A value with no min/max is logged only, not scored.

week_start: mon

groups:
  Morning:
    eye:    {name: Eye routine, note: wash · exercises · palming}
    nasya:  Nasya
    yoga:   {name: Yoga, days: mon tue thu fri}
    calB:   {name: Calisthenics B, note: upper, days: wed}
    voice:  {name: Voice, note: straw · varṇamālā, min: 5 min, max: 10 min}
    comb:   {name: Comb, note: "wide-tooth, dry hair"}

  Nutrition:
    water:  {name: Water, note: 12 oz, count: 6, min: 4}
    greens: {name: Greens, note: cups, count: 4, min: 3, show: one}
    amp:    {name: AM protein, note: smoothie}
    pmp:    {name: PM protein, note: whey}
    tonic:  {name: Carrot–amla tonic, days: weekdays, per_week: 3-4}
    ais:    Anti-inflammatory spice
    afo:    Oily fish / avocado
    abw:    Berries / watermelon
    sff:    Saturated-fat free
    pcf:    {name: Processed-carb free, min: no refined carbs, max: no refined carbs or sugar}

  Training:
    calA:   {name: Calisthenics A, note: lower + core, days: mon}
    track:  {name: Track, days: tue thu}
    easy:   {name: Easy run, days: wed}
    calC:   {name: Calisthenics C, note: full body, days: fri}
    steady: {name: Steady run, days: sat}
    long:   {name: Long run, days: sun}
    mob:    {name: Mobility break, note: + palming, days: mon wed fri}
    miles:  {name: Miles, value: mi}

  Work & study:
    deep:     {name: Deep work, note: "1:30–3:30", days: weekdays, min: 1 hr, max: 2 hr}
    brk:      {name: Screen breaks, note: 20-20-20, days: weekdays, count: 3, min: 2}
    df:       {name: Distraction-free, days: weekdays}
    career:   {name: Career study, days: mon wed sun}
    masters:  {name: Master's, days: sat}
    linkedin: {name: LinkedIn post, days: sun, every: 2, start: 2026-11-22}
    review:   {name: Weekly review, days: sun}

  Evening:
    trataka:  Trataka
    scalp:    Scalp massage
    hoil:     {name: Hair oil, note: bhringraj, days: wed sat}
    hwash:    {name: Hair wash + rinse, days: thu sun}
    fenu:     {name: Fenugreek mask, days: sun}
    pada:     Padabhyanga
    triphala: Triphala
    screens:  Screens off 9:30
    sleep:    Lights out 10:30
</script>

<script>
(() => {
const KEY = 'dailyTracker.v2', OLD = 'dailyTracker.v1';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DN = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
const LV = ['missed','min','max'];
const DEFAULT_YAML = document.getElementById('defaultYaml').textContent.replace(/^\n/, '');

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const noon = d => { const x = new Date(d); x.setHours(12,0,0,0); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d, 12); };

/* ---------- config: YAML → model ---------- */
const OPTS = new Set(['name','note','days','every','start','end','per_week','count','show','value','min','max']);
function parseDays(v, id){
  if (v == null || v === 'daily') return null;
  const set = new Set();
  for (const t of (Array.isArray(v) ? v : String(v).split(/[\s,]+/)).map(x => String(x).toLowerCase()).filter(Boolean)){
    if (t === 'weekdays') [1,2,3,4,5].forEach(x => set.add(x));
    else if (t === 'weekend' || t === 'weekends') [0,6].forEach(x => set.add(x));
    else if (t === 'daily') [0,1,2,3,4,5,6].forEach(x => set.add(x));
    else if (t.slice(0,3) in DN) set.add(DN[t.slice(0,3)]);

  }
  return set;
}
function parseRange(v, id){
  const m = String(v).match(/^\s*(\d+)\s*(?:-\s*(\d+))?\s*$/);
  if (!m) throw new Error(`${id}: per_week must be N or N-M`);
  const lo = +m[1], hi = m[2] ? +m[2] : lo;
  if (lo < 1 || hi < lo || hi > 7) throw new Error(`${id}: per_week out of range`);
  return {min:lo, max:hi};
}
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s));
function compile(text){
  const doc = jsyaml.load(text, {schema: jsyaml.CORE_SCHEMA});
  if (!doc || typeof doc !== 'object' || !doc.groups || typeof doc.groups !== 'object') throw new Error('Missing top-level "groups:".');
  const ws = String(doc.week_start || 'mon').slice(0,3).toLowerCase();
  if (!(ws in DN)) throw new Error('week_start must be a weekday.');
  const seen = new Set(), groups = [];
  for (const [gname, habits] of Object.entries(doc.groups)){
    if (!habits || typeof habits !== 'object' || Array.isArray(habits)) throw new Error(`Group "${gname}" must be a map of id: habit.`);
    const items = [];
    for (const [id, raw] of Object.entries(habits)){
      if (seen.has(id)) throw new Error(`Duplicate id "${id}".`);
      seen.add(id);
      const h = (raw && typeof raw === 'object') ? raw : {name: raw == null ? id : String(raw)};
      for (const k of Object.keys(h)) if (!OPTS.has(k)) throw new Error(`${id}: unknown option "${k}"`);
      const it = {id, name: String(h.name ?? id), note: h.note != null ? String(h.note) : '',

        start: h.start != null ? String(h.start) : null, end: h.end != null ? String(h.end) : null,
        perWeek: h.per_week != null ? parseRange(h.per_week, id) : null};
      if (!(Number.isInteger(it.every) && it.every >= 1)) throw new Error(`${id}: every must be a whole number ≥ 1`);
      if (it.every > 1 && !it.start) throw new Error(`${id}: every needs a start date`);
      for (const d of [it.start, it.end]) if (d && !isDate(d)) throw new Error(`${id}: dates must be YYYY-MM-DD`);
      if (h.count != null && h.value != null) throw new Error(`${id}: use count or value, not both`);

        if (h.show != null && !['one','dots'].includes(h.show)) throw new Error(`${id}: show is one or dots`);
        it.max = h.max != null ? +h.max : it.count;
        it.min = h.min != null ? +h.min : it.max;

        it.max = h.max != null ? +h.max : (h.min != null ? +h.min : null);
        it.min = h.min != null ? +h.min : it.max;
      } else {
        it.kind = 'check';

      }

    }

/* ---------- state ---------- */
let S = {yaml: DEFAULT_YAML, days: {}, lastBackup: null}, C;
let view = 'day', cur = noon(new Date()), storageOK = true, savedAt = null, notice = '';

function migrateV1(old, cfg){
  const days = {};
  for (const [k, r] of Object.entries(old.days || {})){
    const v = {};
    for (const it of cfg.all){
      const a = r.v && r.v[it.id];
      if (Array.isArray(a)){
        if (it.kind === 'check') v[it.id] = Math.max(0, ...a.map(x => x|0));

}
function load(){
  try {
    const r = localStorage.getItem(KEY);
    if (r) Object.assign(S, JSON.parse(r));
    else {
      const o = localStorage.getItem(OLD);
      if (o){ const old = JSON.parse(o); S.days = migrateV1(old, compile(S.yaml)); S.lastBackup = old.lastBackup || null; notice = 'Migrated v1 data'; save(); }
    }
  } catch(e){ storageOK = false; }
  try { C = compile(S.yaml); } catch(e){ notice = 'Config error – defaults used'; C = compile(DEFAULT_YAML); }
  if (!S.days || typeof S.days !== 'object') S.days = {};
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); savedAt = new Date(); storageOK = true; }
  catch(e){ storageOK = false; }
}

/* ---------- scheduling & scoring ---------- */
const weekStartOf = d => addDays(d, -((d.getDay() - C.weekStart + 7) % 7));
function sched(it, d){
  const k = key(d);
  if (it.start && k < it.start) return false;
  if (it.end && k > it.end) return false;
  if (it.days && !it.days.has(d.getDay())) return false;
  if (it.every > 1){
    const w = Math.round((weekStartOf(d) - weekStartOf(parseKey(it.start))) / 6048e5);
    if (w % it.every) return false;
  }
  return true;
}
const val = (k, it) => +(((S.days[k] || {}).v || {})[it.id] || 0);
function level(it, v){
  if (it.kind === 'check') return Math.max(0, Math.min(2, v|0));
  if (it.min == null) return null;           // logged only
  return v >= it.max ? 2 : v >= it.min ? 1 : 0;
}
const shade = (it, v) => { const l = level(it, v); return l ? String(l) : (v > 0 && it.kind !== 'check' ? 'p' : '0'); };
function weekDone(it, d){
  const s = weekStartOf(d); let n = 0;
  for (let i = 0; i < 7; i++){ const x = addDays(s,i); if (sched(it,x) && (level(it, val(key(x),it)) || 0) >= 1) n++; }
  return n;
}
const weekLevel = (it, d) => { const n = weekDone(it,d); return n >= it.perWeek.max ? 2 : n >= it.perWeek.min ? 1 : 0; };
function dayScore(d){
  let hit = 0, max = 0, t = 0; const k = key(d);
  for (const it of C.all){
    if (it.perWeek || !sched(it,d)) continue;
    const l = level(it, val(k,it)); if (l == null) continue;
    t++; if (l >= 1) hit++; if (l === 2) max++;
  }
  return {hit, max, t};
}
function weekScore(d, upto){
  const s = weekStartOf(d); let hit = 0, t = 0;
  for (let i = 0; i < 7; i++){ const x = addDays(s,i); if (upto && x > upto) break; const r = dayScore(x); hit += r.hit; t += r.t; }
  for (const it of C.all) if (it.perWeek){ t++; if (weekLevel(it,d) >= 1) hit++; }
  return t ? Math.round(hit/t*100) : 0;
}
const pct = r => r.t ? Math.round(r.hit/r.t*100) : 0;

/* ---------- day view ---------- */
function crit(it){
  if (it.kind === 'check') return it.minText || it.maxText ? `min: ${it.minText || '–'} · max: ${it.maxText || '–'}` : '';
  if (it.min == null) return '';
  const u = it.kind === 'value' && it.unit ? ' ' + it.unit : '';
  return it.min === it.max ? `goal ${it.max}${u}` : `min ${it.min} · max ${it.max}${u}`;
}
function rowHtml(it){
  const k = key(cur), v = val(k,it);
  let ctl = '';
  if (it.kind === 'check'){
    const l = level(it,v);
    ctl = `<button class="dot" data-id="${esc(it.id)}" data-s="${l}" aria-label="${esc(it.name)}: ${LV[l]}"></button>`;
  } else if (it.kind === 'count' && it.show === 'dots'){
    const s = shade(it,v);
    for (let i = 0; i < it.count; i++){
      if (i === it.min && it.min < it.count && it.min !== it.max) ctl += `<span class="thr" title="min ${it.min}"></span>`;
      ctl += `<button class="dot" data-id="${esc(it.id)}" data-i="${i}" data-s="${i < v ? s : 0}" aria-label="${esc(it.name)} ${i+1} of ${it.count}"></button>`;
    }
  } else if (it.kind === 'count'){
    ctl = `<span class="unit">${v}/${it.count}</span><button class="dot" data-id="${esc(it.id)}" data-s="${shade(it,v)}" aria-label="${esc(it.name)}: ${v} of ${it.count}, click to add">${v || ''}</button>`;
  } else {
    ctl = `<input class="field num" data-id="${esc(it.id)}" type="number" inputmode="decimal" step="any" min="0" value="${v || ''}" aria-label="${esc(it.name)}"><span class="unit">${esc(it.unit)}</span>` +
      (it.min != null ? `<span class="dot" data-s="${shade(it,v)}" aria-hidden="true"></span>` : '');
  }
  const c = crit(it);
  const pw = it.perWeek ? `<small>${weekDone(it,cur)} of ${it.perWeek.min}${it.perWeek.max > it.perWeek.min ? '–' + it.perWeek.max : ''} this week</small>` : '';
  return `<div class="row" data-row="${esc(it.id)}"><div class="lab">${esc(it.name)}${it.note ? `<small>${esc(it.note)}</small>` : ''}${pw}${c ? `<span class="crit">${esc(c)}</span>` : ''}</div><div class="dots">${ctl}</div></div>`;
}
function progHtml(){
  const r = dayScore(cur);
  return `<div class="sunken pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct(r)}"><i style="width:${pct(r)}%"></i></div><span style="min-width:110px;text-align:right">${r.hit}/${r.t} · ${r.max} max · ${pct(r)}%</span>`;
}
function renderDay(){
  let h = `<div class="prog" id="prog">${progHtml()}</div>`;
  for (const g of C.groups){
    const items = g.items.filter(it => sched(it,cur));
    if (!items.length) continue;
    h += `<fieldset><legend>${esc(g.name)}</legend>${items.map(rowHtml).join('')}</fieldset>`;
  }
  h += `<fieldset><legend>Notes</legend><textarea id="note" class="field" rows="3" aria-label="Notes">${esc((S.days[key(cur)] || {}).note)}</textarea></fieldset>`;
  $('view').innerHTML = h;
}
function setVal(it, v){
  const k = key(cur), r = S.days[k] || (S.days[k] = {v:{}});
  r.v = r.v || {};
  if (v) r.v[it.id] = v; else delete r.v[it.id];
  save();
}
function refreshRow(it, focusSel){
  const row = $('view').querySelector(`[data-row="${CSS.escape(it.id)}"]`);
  if (row){ row.outerHTML = rowHtml(it); if (focusSel){ const f = $('view').querySelector(`[data-row="${CSS.escape(it.id)}"] ${focusSel}`); f && f.focus(); } }
  $('prog').innerHTML = progHtml(); status();
}

/* ---------- week view ---------- */
function renderWeek(){
  const s = weekStartOf(cur), days = [...Array(7)].map((_,i) => addDays(s,i)), tk = key(new Date());
  let h = `<div class="sunken scroll"><table class="wk"><thead><tr><th style="text-align:left;padding-left:4px">Habit</th>` +
    days.map(d => `<th><button class="b dh${key(d)===tk?' today':''}" data-go="${key(d)}">${DOW[d.getDay()]}<br>${d.getDate()}</button></th>`).join('') +
    `<th>Wk</th></tr></thead><tbody>`;
  for (const g of C.groups){
    h += `<tr class="gh"><th colspan="9">${esc(g.name)}</th></tr>`;
    for (const it of g.items){
      let n = 0, sum = 0, ds = 0;
      const cells = days.map(d => {
        if (!sched(it,d)) return `<td class="na"></td>`;
        ds++; const v = val(key(d),it); sum += v; if ((level(it,v) || 0) >= 1) n++;
        const num = it.kind !== 'check' && v ? `<span class="mn">${v}</span>` : '';
        return `<td title="${esc(it.name)}: ${it.kind === 'check' ? LV[level(it,v)] : v}"><i class="m" data-s="${shade(it,v)}"></i>${num}</td>`;
      }).join('');
      let tot;
      if (it.perWeek) tot = `<span class="m" data-s="${weekLevel(it,cur)}"></span> ${n}/${it.perWeek.min}${it.perWeek.max > it.perWeek.min ? '–' + it.perWeek.max : ''}`;
      else if (it.kind === 'value' && it.min == null) tot = sum ? `${+sum.toFixed(2)}${it.unit ? ' ' + esc(it.unit) : ''}` : '';
      else tot = ds ? `${n}/${ds}` : '';
      h += `<tr><td class="it" title="${esc(it.name)}">${esc(it.name)}</td>${cells}<td class="tot">${tot}</td></tr>`;
    }
  }
  h += `</tbody><tfoot><tr><td class="it">Done</td>` + days.map(d => `<td>${pct(dayScore(d))}%</td>`).join('') + `<td class="tot">${weekScore(cur)}%</td></tr></tfoot></table></div>`;
  $('view').innerHTML = h;
}

/* ---------- chrome ---------- */
function render(){
  $('vDay').classList.toggle('on', view === 'day');
  $('vWeek').classList.toggle('on', view === 'week');
  if (view === 'day'){
    $('when').textContent = `${DOW[cur.getDay()]} ${MON[cur.getMonth()]} ${cur.getDate()}, ${cur.getFullYear()}${key(cur) === key(new Date()) ? ' (today)' : ''}`;
    renderDay();
  } else {
    const s = weekStartOf(cur), e = addDays(s,6);
    $('when').textContent = `Week of ${MON[s.getMonth()]} ${s.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}`;
    renderWeek();
  }
  $('ttl').textContent = `Daily Tracker - ${key(cur)}`;
  status();
}
function status(){
  const now = noon(new Date());
  $('s1').textContent = `Today ${pct(dayScore(now))}%`;
  $('s2').textContent = `Week ${weekScore(now, now)}%`;
  const s3 = $('s3');
  s3.textContent = !storageOK ? 'Storage off – export!' : notice || (savedAt ? `Saved ${pad(savedAt.getHours())}:${pad(savedAt.getMinutes())}` : 'Ready');
  s3.className = storageOK ? '' : 'warn';
  const s4 = $('s4'), any = Object.keys(S.days).length > 0;
  if (!S.lastBackup){ s4.textContent = any ? 'No backup yet' : 'Backup: –'; s4.className = any ? 'warn' : ''; }
  else { const d = Math.floor((Date.now() - S.lastBackup) / 864e5); s4.textContent = `Backup ${d ? d + 'd ago' : 'today'}`; s4.className = d > 7 ? 'warn' : ''; }
}
const find = id => C.all.find(x => x.id === id);

$('view').addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go){ cur = parseKey(go.dataset.go); view = 'day'; render(); return; }
  const b = e.target.closest('button.dot'); if (!b) return;
  const it = find(b.dataset.id); if (!it) return;
  const v = val(key(cur), it); let nv;
  if (it.kind === 'check') nv = (v + 1) % 3;
  else if (it.show === 'dots'){ const i = +b.dataset.i; nv = v === i + 1 ? i : i + 1; }
  else nv = v >= it.count ? 0 : v + 1;
  notice = ''; setVal(it, nv);
  refreshRow(it, b.dataset.i != null ? `[data-i="${b.dataset.i}"]` : 'button.dot');
});
$('view').addEventListener('contextmenu', e => {
  const b = e.target.closest('button.dot'); if (!b) return;
  const it = find(b.dataset.id); if (!it || it.kind !== 'count') return;
  e.preventDefault();
  setVal(it, Math.max(0, val(key(cur), it) - 1)); refreshRow(it, 'button.dot');
});
$('view').addEventListener('input', e => {
  if (e.target.id === 'note'){ const k = key(cur); (S.days[k] || (S.days[k] = {v:{}})).note = e.target.value; save(); status(); return; }
  if (e.target.matches('input.num')){
    const it = find(e.target.dataset.id); if (!it) return;
    setVal(it, Math.max(0, parseFloat(e.target.value) || 0));
    const dot = e.target.parentNode.querySelector('span.dot');
    if (dot) dot.dataset.s = shade(it, val(key(cur), it));
    $('prog').innerHTML = progHtml(); status();
  }
});
const step = n => { cur = addDays(cur, view === 'week' ? 7*n : n); render(); };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('today').onclick = () => { cur = noon(new Date()); render(); };
$('vDay').onclick = () => { view = 'day'; render(); };
$('vWeek').onclick = () => { view = 'week'; render(); };
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || $('dlg').open || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key.toLowerCase() === 't') $('today').click();
  else if (e.key.toLowerCase() === 'w'){ view = view === 'day' ? 'week' : 'day'; render(); }
});

/* ---------- files ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('exp').onclick = () => {
  S.lastBackup = Date.now();
  download(`tracker-backup-${key(new Date())}.json`, JSON.stringify({app:'daily-tracker', version:2, exported:new Date().toISOString(), ...S}), 'application/json');
  save(); status();
};
$('imp').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      if (/\.ya?ml$/i.test(f.name)){
        const c = compile(rd.result);
        if (!confirm(`Replace habits config with ${f.name} (${c.all.length} habits)? Your data is kept.`)) return;
        S.yaml = rd.result; C = c;
      } else {
        const o = JSON.parse(rd.result);
        if (!o || typeof o.days !== 'object') throw new Error('No "days" found in file.');
        if (!confirm(`Replace all data with ${Object.keys(o.days).length} day(s) from ${f.name}?`)) return;
        if (o.version === 2){ if (o.yaml){ C = compile(o.yaml); S.yaml = o.yaml; } S.days = o.days; }
        else S.days = migrateV1(o, C);
        S.lastBackup = o.lastBackup || S.lastBackup;
      }
      notice = 'Imported ' + f.name; save(); render();
    } catch(err){ alert('Import failed: ' + err.message); }
  };
  rd.readAsText(f);
};

/* ---------- config editor ---------- */
const dlg = $('dlg');
$('edit').onclick = () => { $('cfg').value = S.yaml; $('cfgErr').textContent = ''; dlg.showModal(); };
$('cfgNo').onclick = () => dlg.close();
$('cfgDef').onclick = () => { $('cfg').value = DEFAULT_YAML; $('cfgErr').textContent = ''; };
$('cfgSave').onclick = () => download('habits.yaml', $('cfg').value, 'text/yaml');
$('cfgOk').onclick = () => {
  try { C = compile($('cfg').value); S.yaml = $('cfg').value; notice = ''; save(); dlg.close(); render(); }
  catch(err){ $('cfgErr').textContent = err.message.split('\n')[0]; }
};
$('cfg').addEventListener('keydown', e => {
  if (e.key === 'Tab'){ e.preventDefault(); const t = e.target, s = t.selectionStart; t.setRangeText('  ', s, t.selectionEnd, 'end'); }
});

load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
setInterval(status, 60000);
})();
</script>
</body>
</html>
