# Daily Tracker · habits config v2
# Live routine · first tracked day 2026-11-23 · fresh start (issue #8)
#
#   id: Name                     daily check · tap toggles done (min)
#   id: {name: …, options}
#
#   note: text                   hint beside the name
#   days: mon wed fri            or weekdays | weekend | daily (default)
#   every: 2                     every N weeks on `days`, counted from `start`
#   start / end: YYYY-MM-DD      active date range
#   per_week: 3 | 3-4            flexible target, scored per week (min-max)
#   count: 6                     counter with 6 units (one circle each)
#   show: one                    counter as a single circle · tap +1, right-click −1
#   value: mi                    number entry in that unit
#   min                          what counts as done · number → threshold for
#                                count/value (a counter defaults to its count)
#                                · text → criteria for a check
#   max                          optional extra credit, only when written · needs
#                                min for count/value · text makes a check 3-level
#   avoid: true                  something to avoid · tap: blank → clean (green, = min)
#                                → failed (red) → blank
#
# ids key your history: rename `name` freely, keep ids stable.
# A value with no min/max is logged only, not scored.

week_start: mon

groups:
  Morning:
    snooze: Zero snooze
    light:  Morning light
    abhy:   {name: Abhyanga, per_week: 3}
    dhyan:  Dhyan
    nasya:  Nasya
    eye:    {name: Eye routine, note: exercises · compress, min: partial, max: all}
    hair:   {name: Hair routine, min: scalp massage, max: + nail rubbing}
    voice:  {name: Voice, note: straw · varṇamālā, min: 10 min}

  Nutrition:
    water:  {name: Water, note: 20 oz, count: 5, min: 4, max: 5}
    meals:  {name: Meal schedule, note: "9:30 · 1:00 · 4:30", min: roughly on time, max: on schedule}
    protein: {name: Protein, note: goal 60–80 g, value: g}
    supps:  {name: Supplements, note: shilajit · krill oil · pumpkin seed oil, min: partial, max: all}
    tonic:  {name: Carrot–amla tonic, per_week: 5}
    sf:     {name: Added-sugar free, avoid: true}

  Training:
    yoga:   Yoga
    calA:   {name: Calisthenics A, note: lower + core, days: mon}
    calB:   {name: Calisthenics B, note: upper, days: wed}
    calC:   {name: Calisthenics C, note: full body, days: fri}
    run:    {name: Training run, note: see plan, days: mon tue thu}
    track:  {name: Track workout, note: tempo / 400s, days: sat}
    dist:   {name: Distance run, note: see plan, days: sun}
    miles:  {name: Miles, value: mi, days: mon tue thu sat sun}
    sauna:  {name: Sauna, per_week: 1}
    mob:    {name: Mobility routine, per_week: 3}

  Work & study:
    deep:     {name: Deep work, days: weekdays, min: 2 hr, max: 3 hr}
    brk:      {name: Screen breaks, note: 20-20-20, days: weekdays, count: 3, min: 2, max: 3}
    nsm:      {name: No social media, avoid: true}
    er:       {name: Energy retention, avoid: true}
    career:   {name: Career work, per_week: 3, min: 1 hr session}
    review:   {name: Weekly review, days: sun}

  Evening:
    screens:  Screens off 9:00
    triphala: Triphala
    trataka:  Trataka
    hoil:     {name: Hair oil, note: bhringraj, per_week: 2}
    hwash:    {name: Hair wash + rinse, per_week: 2, min: regular, max: herbal}
    comb:     {name: Comb, note: "wide-tooth, dry hair"}
    pada:     Padabhyanga
    read:     {name: Reading, value: pgs, min: 20, max: 30}
    sleep:    Lights out 10:30
