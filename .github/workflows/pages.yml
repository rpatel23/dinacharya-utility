# Option 1: test, then publish only public/ to GitHub Pages (docs/DEPLOYMENT.md §2.2).
# Requires Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # find the last successful deploy for the habits.yaml report
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the report compares against an earlier commit
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Playwright and PyYAML
        run: |
          pip install playwright pyyaml
          python -m playwright install --with-deps chromium
      # Non-blocking report of risky habits.yaml changes since the last successful deploy (docs/CONFIG-CHANGES.md).
      - name: habits.yaml change report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=$(gh run list --workflow pages.yml --branch main --status success -L 1 --json headSha -q '.[0].headSha' || true)
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD~1 2>/dev/null || true); fi
          git show "$base:public/habits.yaml" > "$RUNNER_TEMP/old.yaml" 2>/dev/null || : > "$RUNNER_TEMP/old.yaml"
          python tools/config_diff.py "$RUNNER_TEMP/old.yaml" public/habits.yaml --base "$base" --head "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: habits.yaml change report test
        run: python tests/config_diff_test.py
      - name: App smoke test
        run: python tests/smoke_test.py
      - name: Server test (Option 3)
        run: python tests/server_test.py
      - name: Cloudflare function test (Option 2)
        run: node tests/cf_function_test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site from public/
        run: |
          cp -r public _site
          # Name the service worker cache after the commit, so every deploy reaches devices
          # without bumping CACHE by hand.
          sed -i -E "s/^const CACHE = '[^']*';/const CACHE = 'tracker-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "^const CACHE = 'tracker-${GITHUB_SHA::7}';" _site/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
